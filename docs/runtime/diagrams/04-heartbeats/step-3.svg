<circle cx="42" cy="62" r="4.5" fill="#5bc99e"/>
<text x="54" y="67" xml:space="preserve" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#fafafa" text-anchor="start">Supervisor A</text>
<text x="38" y="86" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#a1a1a1" text-anchor="start">every 5 s: heartbeat + register</text>
<text x="38" y="104" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#a1a1a1" text-anchor="start">every 5 s: poll → reap + fill</text>
<rect x="24" y="230" width="236" height="110" rx="10" stroke-width="1.2"><animate attributeName="fill" dur="5s" repeatCount="indefinite" calcMode="discrete" values="rgba(255,100,103,0.14)" keyTimes="0"/><animate attributeName="stroke" dur="5s" repeatCount="indefinite" calcMode="discrete" values="#ff6467" keyTimes="0"/></rect>
<circle cx="42" cy="252" r="4.5"><animate attributeName="fill" dur="5s" repeatCount="indefinite" calcMode="discrete" values="#ff6467" keyTimes="0"/></circle>
