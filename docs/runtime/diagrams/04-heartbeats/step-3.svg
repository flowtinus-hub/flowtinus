<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="1" keyTimes="0"/><text x="38" y="280" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#ff6467" text-anchor="start">container killed (OOM, kill -9)</text></g>
<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="1" keyTimes="0"/><text x="38" y="298" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#ff6467" text-anchor="start">no more heartbeats</text></g>
