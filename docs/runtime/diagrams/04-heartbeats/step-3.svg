<text x="36" y="26.5" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5" font-weight="600" fill="#fafafa" text-anchor="start">Heartbeats and lost runs · step 3 of 4</text>
<text x="982" y="26.5" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="400" fill="#a1a1a1" text-anchor="end">register · heartbeat · reap</text>
<g transform="translate(0 44)">
