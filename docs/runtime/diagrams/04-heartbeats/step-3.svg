<text x="362" y="106" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#fafafa" text-anchor="start">A · tags {default} · workers 2 · last_seen = now()</text>
<g><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.6"/><rect x="350" y="122" width="606" height="30" rx="5" stroke-width="1.2"><animate attributeName="fill" dur="5s" repeatCount="indefinite" calcMode="discrete" values="rgba(255,100,103,0.14)" keyTimes="0"/><animate attributeName="stroke" dur="5s" repeatCount="indefinite" calcMode="discrete" values="#ff6467" keyTimes="0"/></rect><g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="1" keyTimes="0"/><text x="362" y="142" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#ff6467" text-anchor="start">B · tags {default} · workers 1 · last_seen getting older…</text></g></g>
<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.6"/><text x="362" y="142" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#a1a1a1" text-anchor="start">B · row deleted: gone from the Workers page</text></g>
<text x="350" y="184" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11.5" font-weight="600" fill="#fafafa" text-anchor="start">runs</text>
<rect x="350" y="194" width="606" height="30" rx="5" stroke-width="1.2"><animate attributeName="fill" dur="5s" repeatCount="indefinite" calcMode="discrete" values="rgba(242,169,59,0.14);rgba(255,100,103,0.14)" keyTimes="0;0.6"/><animate attributeName="stroke" dur="5s" repeatCount="indefinite" calcMode="discrete" values="#f2a93b;#ff6467" keyTimes="0;0.6"/></rect>
<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.6"/><text x="362" y="214" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="400" fill="#fafafa" text-anchor="start">R7 · running · worker_id B · heartbeat_at</text></g>
<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="0;1" keyTimes="0;0.6"/><text x="362" y="214" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="600" fill="#ff6467" text-anchor="start">R7 · failed · 'The supervisor running it stopped.'</text></g>
<text x="350" y="263" xml:space="preserve" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" font-weight="600" fill="#fafafa" text-anchor="start">B silent for</text>
<rect x="450" y="251" width="486" height="16" rx="8" fill="#171717" stroke="rgba(255,255,255,0.18)"/>
<rect x="450" y="251" width="0" height="16" rx="8" fill="#ff6467" opacity="0.8"><animate attributeName="width" dur="5s" repeatCount="indefinite" values="0;0;486;486" keyTimes="0;0;0.3;1"/></rect>
<text x="450" y="286" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#a1a1a1" text-anchor="start">0 s</text>
<text x="936" y="286" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#ff6467" text-anchor="end">60 s: lost</text>
<path d="M531 248 L531 270" stroke="#a1a1a1" stroke-dasharray="2 2"/>
<text x="537" y="286" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#a1a1a1" text-anchor="start">10 s: same host, pid gone</text>
<text x="350" y="326" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="400" fill="#a1a1a1" text-anchor="start">SUPERVISOR_LOST_AFTER_MS = STALE_AFTER_MS = 60 s · heartbeat every 5 s</text>








<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="0;1;0" keyTimes="0;0.25;0.525"/><animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" path="M260 90 L350 101" keyPoints="0;0;1;1" keyTimes="0;0.25;0.5;1"/><circle r="4.5" fill="#5bc99e" stroke="#111" stroke-width="1.5"/></g>









<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="1;0" keyTimes="0;0.575"/><animateMotion dur="5s" repeatCount="indefinite" calcMode="linear" path="M260 130 L350 209" keyPoints="0;1;1" keyTimes="0;0.55;1"/><circle r="5" fill="#f2af48" stroke="#111" stroke-width="1.5"/><text x="0" y="20" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="10.5" font-weight="600" fill="#f2af48" text-anchor="middle" stroke="#23272b" stroke-width="4" stroke-linejoin="round" paint-order="stroke">reapGone</text></g>
<circle cx="650" cy="209" r="0" fill="none" stroke="#ff6467" stroke-width="2.5" opacity="0"><animate attributeName="r" dur="5s" repeatCount="indefinite" values="0;0;50;50" keyTimes="0;0.55;0.7;1"/><animate attributeName="opacity" dur="5s" repeatCount="indefinite" values="0;0.9;0;0" keyTimes="0;0.55;0.7;1"/></circle>
</g>


<g opacity="0"><animate attributeName="opacity" dur="5s" repeatCount="indefinite" calcMode="discrete" values="1" keyTimes="0"/><rect x="18" y="479" width="22" height="20" rx="10" fill="#f2a93b"/><text x="29" y="493.5" xml:space="preserve" font-family="'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="700" fill="#111111" text-anchor="middle">3</text><text x="50" y="493" xml:space="preserve" font-family="Inter, ui-sans-serif, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13" font-weight="400" fill="#fafafa" text-anchor="start">A’s poll runs reapGone: B unseen for 60 s → failRunsOf(B), then its row goes</text></g>

