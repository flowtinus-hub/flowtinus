version: 1
id: page-router-fanout
name: 'perf: page router fan-out'
nodes:
  - id: start
    type: start
    label: Start
    position:
      x: 0
      y: 0
    config:
      acceptsInput: true
      parameters:
        - name: targetSchema
          type: text
          default: perf
          required: true
        - name: etlContextId
          type: text
          default: perf-router
          required: true
  - id: plan
    type: typescript
    label: Plan page transformer calls
    outputKey: page
    position:
      x: 260
      y: 0
    config:
      code: |
        import { latestSnapshots } from '@myproject/scripts/Shared/SnapshotBatch';
        import { transformerRoutes } from '@myproject/scripts/Shared/TransformerRoutes';
        async function process($input: Data) {
          if (typeof $input.collectionName !== 'string' || !Array.isArray($input.snapshots) || $input.snapshots.length > 500 || !$PARAMETERS.targetSchema || !$PARAMETERS.etlContextId) {
            throw new Error('A valid collection, a page of at most 500 snapshots, a target schema and a context are required');
          }
          const page = latestSnapshots($input.snapshots);
          const jobs: { path: string; input: unknown; field: string }[] = [];
          for (const route of transformerRoutes($input.collectionName)) {
            for (const snapshot of page) {
              for (const field of route.fields) {
                jobs.push({ path: route.path, input: snapshot, field });
              }
            }
          }
          return { jobs, pageCount: page.length };
        }
  - id: split
    type: split
    label: Split transformer jobs
    position:
      x: 520
      y: 120
    config:
      list: $page.jobs
  - id: invoke
    type: flow
    label: Invoke page transformer
    position:
      x: 780
      y: 120
    config:
      call: wait
      flowId: $dynamic
      flowPath:
        value: $path
        expression: true
      input:
        value: $input
        expression: true
      inputSource: expression
      sendEnvelope: true
      onError: divert
      parameters:
        - name: targetSchema
          value: $PARAMETERS.targetSchema
          expression: true
        - name: etlContextId
          value: $PARAMETERS.etlContextId
          expression: true
        - name: field
          value: $field
          expression: true
  - id: wait
    type: wait
    label: Wait for page jobs
    position:
      x: 1040
      y: 0
    config: {}
  - id: check
    type: typescript
    label: Check page completion
    override: true
    position:
      x: 1300
      y: 0
    config:
      code: |
        async function process($input: Data) {
          if ($input.wait.status === 'failure') {
            throw new Error($input.wait.firstError?.message ?? 'A page transformer failed');
          }
          return { status: $input.wait.status, jobs: $input.page.jobs.length, snapshots: $input.page.pageCount };
        }
  - id: end
    type: end
    label: End
    position:
      x: 1560
      y: 0
    config: {}
edges:
  - source: start
    sourcePort: out-0
    target: plan
    targetPort: in-0
  - source: plan
    sourcePort: out-0
    target: split
    targetPort: in-0
  - source: plan
    sourcePort: out-0
    target: wait
    targetPort: in-0
  - source: split
    sourcePort: out-0
    target: invoke
    targetPort: in-0
  - source: invoke
    sourcePort: out-0
    target: wait
    targetPort: in-1
  - source: invoke
    sourcePort: error
    target: wait
    targetPort: in-1
  - source: wait
    sourcePort: out-0
    target: check
    targetPort: in-0
  - source: check
    sourcePort: out-0
    target: end
    targetPort: in-0
