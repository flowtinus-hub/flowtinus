version: 1
id: collection-etl-per-document
name: 'perf: collection ETL per document'
nodes:
  - id: start
    type: start
    label: Start
    position:
      x: 0
      y: 0
    config:
      acceptsInput: true
      parameters:
        - name: size
          type: number
          default: '2000'
        - name: windowStart
          type: text
          default: '2025-01-01T00:00:00.000Z'
          required: true
        - name: windowEnd
          type: text
          default: '2026-01-01T00:00:00.000Z'
          required: true
        - name: etlContextId
          type: text
          default: perf-etl
          required: true
        - name: targetSchema
          type: text
          default: perf
          required: true
  - id: extract
    type: mongodb-pipeline
    label: Extract collection in window
    position:
      x: 260
      y: 0
    config:
      connection: perf-mongodb
      database: ''
      collection:
        value: $collectionName
        expression: true
      pipeline: >-
        (() => { const start = new Date($PARAMETERS.windowStart); const end = new Date($PARAMETERS.windowEnd); return
        [{$match: {Seq: {$lte: Number($PARAMETERS.size)}, $or: $referenceFields.map(field => ({[field]: {$gte: start,
        $lt: end}}))}}, {$sort: {_id: 1}},
        {$project: {_id: 0, document: '$$ROOT'}}]; })()
      outputFormat: extended-json
      timeoutS: 300
  - id: snapshot
    type: typescript
    label: Prepare snapshot
    outputKey: snapshot
    position:
      x: 520
      y: 0
    config:
      code: |
        async function process($input: Data) {
          const d = $input.document;
          const id = typeof d._id === 'string' ? d._id : d._id && d._id.$oid;
          if (!id || !$PARAMETERS.etlContextId) {
            throw new Error('Original _id and etlContextId are required');
          }
          return {...d, _id: 'flowtinus:' + JSON.stringify([$PARAMETERS.etlContextId, id]), OriginalId: id, EtlContextId: $PARAMETERS.etlContextId, ExtractedOn: {$date: {$numberLong: String(Date.now())}}};
        }
  - id: lake
    type: mongodb-upsert
    label: Save snapshot to the lake
    position:
      x: 780
      y: 0
    config:
      connection: perf-mongodb
      database: ''
      collection:
        value: $collectionName + '_lake'
        expression: true
      filter:
        - field: _id
          value: $snapshot._id
          expression: true
      source: expression
      document:
        value: $snapshot
        expression: true
      writeMode: replace
      valueFormat: extended-json
      batchSize: 100
  - id: transform
    type: flow
    label: Invoke the collection's transformer
    position:
      x: 1040
      y: 0
    config:
      call: wait
      flowId: $dynamic
      flowPath:
        value: $mappingPath
        expression: true
      input:
        value: $snapshot
        expression: true
      inputSource: expression
      sendEnvelope: true
      parameters:
        - name: etlContextId
          value: $PARAMETERS.etlContextId
          expression: true
        - name: targetSchema
          value: $PARAMETERS.targetSchema
          expression: true
  - id: end
    type: end
    label: End
    position:
      x: 1300
      y: 0
    config: {}
edges:
  - source: start
    sourcePort: out-0
    target: extract
    targetPort: in-0
  - source: extract
    sourcePort: out-0
    target: snapshot
    targetPort: in-0
  - source: snapshot
    sourcePort: out-0
    target: lake
    targetPort: in-0
  - source: lake
    sourcePort: out-0
    target: transform
    targetPort: in-0
  - source: transform
    sourcePort: out-0
    target: end
    targetPort: in-0
