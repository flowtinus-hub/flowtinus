# The report of the benchmark history on GitHub Pages. This file lives on the results branch (perf-results), where
# `git perf-push` copies it from flowtinus.perf/pages/ when it creates the branch: GitHub reads a push's workflow from
# the pushed commit, so it must be here. The data is this branch (every machine's <hostname>.jsonl); the report's code
# comes from the repository's default branch. Setup (once, on GitHub): see "Benchmark history" in flowtinus.perf/README.md.
name: perf report

on:
  push:
    branches: [perf-results]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# one deploy at a time; a newer push waits and then publishes, so the site ends on the latest
concurrency:
  group: perf-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: results
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          path: code
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      # no install: the site build needs only Bun
      - run: bun code/flowtinus.perf/src/build-site.ts results site
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
